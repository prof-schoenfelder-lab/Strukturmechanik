                      - Lokale Netzverfeinerung: P3_Vernetzung/02_ANSYS_Umsetzung/Lokale_Netzverfeinerung.md
                      - Kantenverrundung: P3_Vernetzung/02_ANSYS_Umsetzung/Kantenverrundung.md
                      - Diskussion: P3_Vernetzung/02_ANSYS_Umsetzung/Diskussion.md
                      - Ergebnis-Tracking: P3_Vernetzung/02_ANSYS_Umsetzung/Ergebnis_Tracking.md
                      - Übung 3: P3_Vernetzung/02_ANSYS_Umsetzung/Uebung-3.md
                      - Übung 4: P3_Vernetzung/02_ANSYS_Umsetzung/Uebung-4.md
                      - Übung 5: P3_Vernetzung/02_ANSYS_Umsetzung/Uebung-5.md
              - Zusammenfassung: P3_Vernetzung/02_ANSYS_Umsetzung/Zusammenfassung.md
      - ABSTRAKTIONEN:
              - P4_Abstraktionen/index.md
              - Symmetrie:
                      - Theorie: P4_Abstraktionen/01_Symmetrie/Symmetrie.md
                      - Umsetzung ANSYS: P4_Abstraktionen/01_Symmetrie/Umsetzung.md
                      - Grafikeinstellungen: P4_Abstraktionen/01_Symmetrie/Grafikeinstellungen.md
                      - Übung 1: P4_Abstraktionen/01_Symmetrie/Uebung01.md
                      - Übung 2: P4_Abstraktionen/01_Symmetrie/Uebung02.md
              - 2D Ebener Spannungzustand:
                      - Theorie: P4_Abstraktionen/02_ESZ/EbenerSpannungszustand.md
                      - Umsetzung ANSYS: P4_Abstraktionen/02_ESZ/Umsetzung.md
                      - Übung 1-2D: P4_Abstraktionen/02_ESZ/Uebung01-2D.md
                      - Übung 2-2D: P4_Abstraktionen/02_ESZ/Uebung02-2D.md
              - 2D Rotationssymmetrie:
                      - Theorie: P4_Abstraktionen/03_Rotationssymmetrie/Rotationssymmetrie.md
                      - Umsetzung ANSYS: P4_Abstraktionen/03_Rotationssymmetrie/Umsetzung.md
                      - Übung 3: P4_Abstraktionen/03_Rotationssymmetrie/Uebung03.md
              - Linienstrukturen:
                      - Theorie: P4_Abstraktionen/04_Linienstrukturen/Linienstrukturen.md
                      - Umsetzung ANSYS: P4_Abstraktionen/04_Linienstrukturen/Umsetzung.md
                      - Übung 1-Beam: P4_Abstraktionen/04_Linienstrukturen/Uebung01-BEAM.md
              - Flaechenstrukturen:
                      - Theorie: P4_Abstraktionen/05_Flaechenstrukturen/Flaechenstrukturen.md
                      - Umsetzung ANSYS: P4_Abstraktionen/05_Flaechenstrukturen/Umsetzung.md
                      - Übung 4: P4_Abstraktionen/05_Flaechenstrukturen/Uebung04.md
      - FAQ:
