                      - elastische Lagerung: P2_Geometrie_Randbedingungen/02_Lagerungen/Elastic.md
                      - Übung 5: P2_Geometrie_Randbedingungen/02_Lagerungen/Uebung-5.md
                      - Übung 6: P2_Geometrie_Randbedingungen/02_Lagerungen/Uebung-6.md
              - BELASTUNGEN:
                      - Verschiebungen: P2_Geometrie_Randbedingungen/03_Belastungen/DisplacementLoad.md
                      - Kräfte: P2_Geometrie_Randbedingungen/03_Belastungen/Force.md
                      - Externe Kräfte: P2_Geometrie_Randbedingungen/03_Belastungen/RemoteForce.md
                      - Übung 7: P2_Geometrie_Randbedingungen/03_Belastungen/Uebung-7.md
